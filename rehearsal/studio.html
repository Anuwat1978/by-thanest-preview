<title>By Thanest Studio</title>
<!-- The Final studio with the new art (Aoh 2026-10-05: "เอาเข้าเว็บจริง"). Embedded by /rehearsal/ as its one stage.
     Opening: the ink loader fills (real loading), turns into the lid; the box pops up to catch it; the scene assembles
     (clip 4) and the box drops onto the shirt; then the Maker notices you (clip 3) and keeps writing (clip 1).
     The box follows the tracked shirt collar. Tap the box: the monster startles. Sound on (MENU): the music groove (clip 2).
     The box, lid, steam and monster are 2D here; the 3D box and lid (drag, physics) come back in a later step. -->
<style>
:root{--ink:#2b182a;--panel:#fffaf0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f6e8cb;font-family:system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;left:12px;bottom:12px;z-index:2;width:min(330px,calc(100vw - 24px));background:var(--panel);border:2px solid var(--ink);
  padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:10px}
.panel h1{font-size:14px;margin:0;letter-spacing:.06em}
.panel.min > :not(.head){display:none}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;flex-direction:column;gap:5px}.row > span{font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button{border:2px solid var(--ink);background:#fff;font:inherit;padding:5px 9px;cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:#fff}
.beat{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;background:var(--panel);border:2px solid var(--ink);padding:6px 12px;font-weight:700;font-size:13px;letter-spacing:.04em;white-space:nowrap}
.note{margin:0;color:#6b5a62;font-size:12px;line-height:1.5}
html.embed .panel,html.embed .beat{display:none}
canvas{cursor:default}canvas.over-box{cursor:pointer}
</style>
</head>

<canvas id="c" aria-label="The Maker's studio assembling itself, then the Maker writing at his low table"></canvas>
<div class="beat" id="beat" role="status" aria-live="polite">Loading the studio…</div>
<div class="panel" id="panel">
  <div class="head"><h1>ตัวอย่างฉาก Final (ภาพชุดใหม่)</h1><button id="min" aria-expanded="true">ย่อ</button></div>
  <div class="row"><span>จังหวะ</span>
    <div class="seg"><button id="b-intro">▶ เริ่มใหม่ (ประกอบฉาก)</button><button id="b-music" aria-pressed="false">🎵 เพลง: ปิด</button>
    <button id="b-notice">👋 มีคนเข้ามา</button><button id="b-monster">มอนสเตอร์สะดุ้ง</button></div></div>
  <div class="row"><span>เม็ดสกรีน</span>
    <div class="seg" id="dots"><button data-v="3" aria-pressed="true">ลายจุดทับ</button><button data-v="0">ปิด</button></div></div>
  <p class="note">กล่อง ฝา ควัน และมอนสเตอร์ในหน้านี้เป็นตัวแทน 2D ตัวจริงใน Final กล่องกับฝาเป็น 3D ตากล่องยังไม่กะพริบ (รอทำชั้นตาด้วยโค้ด)</p>
</div>
