<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Monster Staging Test</title>
<!-- Lab staging test (art direction is Aoh's alone, rule 9): the approved monster rises out of the Maker's box head.
     A flat stand-in for the runtime 3D box: the near rim of the box hides the monster's lower body, and the lid is lifted
     as a separate piece. The chosen print screen (DEC-022, palette-keeping mode) is applied over the whole stage in code. -->
<style>
:root{--ink:#2b182a;--panel:#fffaf0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f6e8cb;font-family:system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;left:12px;bottom:12px;z-index:2;width:min(340px,calc(100vw - 24px));background:var(--panel);border:2px solid var(--ink);
  padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:10px}
.panel h1{font-size:14px;margin:0;letter-spacing:.06em}
.panel.min > :not(.head){display:none}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;flex-direction:column;gap:5px}.row > span{font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button{border:2px solid var(--ink);background:#fff;font:inherit;padding:5px 9px;cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:#fff}
label.chk{display:flex;gap:6px;align-items:center}
.beat{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;background:var(--panel);border:2px solid var(--ink);padding:6px 12px;font-weight:700;font-size:13px;letter-spacing:.06em}
.note{margin:0;color:#6b5a62;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<canvas id="c" aria-label="The Maker writing at his low table while the monster rises out of the box on his head"></canvas>
<div class="beat" id="beat" role="status" aria-live="polite">—</div>
<div class="panel" id="panel">
  <div class="head"><h1>ทดลองมอนสเตอร์โผล่จากกล่อง</h1><button id="min" aria-expanded="true">ย่อ</button></div>
  <div class="row"><span>ขนาดมอนสเตอร์</span>
    <div class="seg" id="size"><button data-v="S">เล็ก</button><button data-v="M" aria-pressed="true">กลาง</button><button data-v="L">ใหญ่</button></div></div>
  <div class="row"><span>จังหวะ</span>
    <div class="seg" id="beats"><button data-v="play" aria-pressed="true">เล่นวน ▶</button><button data-v="hide">ซ่อน</button><button data-v="peek">แอบมอง</button><button data-v="full">โผล่เต็มตัว</button></div></div>
  <div class="row"><span>เม็ดสกรีน</span>
    <div class="seg" id="dots"><button data-v="3" aria-pressed="true">ลายจุดทับ (เม็ดเล็ก)</button><button data-v="1">สกรีนในสีเดิม</button><button data-v="0">ปิด</button></div></div>
  <p class="note">ภาพทดสอบจากแชต ตัวจริงกล่องกับฝาจะเป็น 3D ผนังกล่องบังตัวมอนสเตอร์เอง ส่วนนี้คือการดูขนาดและจังหวะเท่านั้น</p>
</div>
<script>
const $=id=>document.getElementById(id);
const ART='../art/incoming/aoh-2026-10-04/';
// master coordinates (master_print_v1, 1376×768); HEAD = headroom added above the master for the rising monster
const MW=1376,MH=768,HEAD=360,CW=MW,CH=MH+HEAD;
const RIM=[[1376,275],[732.5,275],[545,293],[427.5,202.5],[0,202.5]]; // near rim of the box opening: the monster shows above it
const LID={x:430,y:40,w:370,h:140};                                      // the floating lid, lifted as its own piece
const MON={cx:592,base:290,body:820};                                    // opening centre, rim height under it, body width in monster px
const SIZES={S:150/820,M:205/820,L:265/820};                             // head-body width on the box: about 150 / 205 / 265 master px
const RISE={hide:-40,peek:430,full:1170};                                // monster px shown above the rim (eyes only / head-body out)
const S={size:'M',mode:'play',screen:1,dots:3,t0:performance.now()};
// --- timeline (seconds, loops): hide → peek + look around → duck → pop out with the lid flying → bob → duck
const TL=[[0,'hide'],[1,'peek'],[3.6,'hide'],[4.8,'full'],[8.4,'hide'],[10,'hide']];
const LABEL={hide:'ซ่อนอยู่ในกล่อง',peek:'แอบมอง (ตาโผล่ ฝาแง้ม)',full:'โผล่เต็มตัว (ฝาเด้งออก)'};
const ease=t=>1-Math.pow(1-t,3), back=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function pose(t){ // returns {rise, dx, rot, lidY, lidX, lidR, beat}
  let beat,from,to,k;
  if(S.mode!=='play'){beat=S.mode;from=to=S.mode;k=1;t=t%10;}
  else{t=t%10;let i=0;while(i<TL.length-1&&t>=TL[i+1][0])i++;beat=TL[i][1];from=i?TL[i-1][1]:'hide';to=beat;
    const dur=to==='hide'?.22:to==='full'?.55:.6;k=Math.min(1,(t-TL[i][0])/dur);}
  const f=to==='full'?back(k):to==='hide'?k:ease(k);
  const rise=RISE[from]+(RISE[to]-RISE[from])*f;
  let dx=0,rot=0,lidY=0,lidX=0,lidR=0;
  if(beat==='peek'){dx=Math.sin(t*2.2)*7*k;rot=Math.sin(t*2.2+.6)*.05*k;lidY=-16*k+Math.sin(t*9)*1.5;}
  if(beat==='full'){const g=SIZES[S.size]/SIZES.M;rot=Math.sin(t*3.6)*.025;lidY=-170*g*ease(k);lidX=(70+150*(g-1)+40)*ease(k);lidR=.22*ease(k);} // the lid clears the bigger monster
  return {rise:Math.max(rise,RISE.hide),dx,rot,lidY,lidX,lidR,beat,bob:beat==='full'?Math.abs(Math.sin(t*3.6))*-6:0};
}
// --- images
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=ART+s;});
let master,monster,ready=false;
Promise.all([load('master_print_v1_cut.png'),load('monster_print_v1_cut.png')]).then(([a,b])=>{master=a;monster=b;ready=true;document.body.dataset.ready='1';});
// --- composite (2D) → print screen (WebGL)
const comp=document.createElement('canvas'),cx=comp.getContext('2d');
function composite(p,scale){
  cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,comp.width,comp.height);cx.setTransform(scale,0,0,scale,0,0);cx.translate(0,HEAD);
  // master without its lid
  cx.save();cx.beginPath();cx.rect(0,LID.y+LID.h,MW,MH);cx.clip();cx.drawImage(master,0,0,MW,MH);cx.restore();
  // the lid, lifted as its own piece
  cx.save();cx.translate(LID.x+LID.w/2+p.lidX,LID.y+LID.h/2+p.lidY);cx.rotate(p.lidR);
  cx.drawImage(master,LID.x,LID.y,LID.w,LID.h,-LID.w/2,-LID.h/2,LID.w,LID.h);cx.restore();
  // the monster, shown only above the near rim of the box
  const s=SIZES[S.size],mw=monster.width*s,mh=monster.height*s;
  cx.save();cx.beginPath();cx.moveTo(0,-HEAD);cx.lineTo(MW,-HEAD);for(const [x,y] of RIM)cx.lineTo(x,y);cx.closePath();cx.clip();
  cx.translate(MON.cx+p.dx,MON.base-p.rise*s+p.bob);cx.rotate(p.rot);cx.drawImage(monster,-mw/2,0,mw,mh);cx.restore();
}
const cv=$('c'),gl=cv.getContext('webgl',{antialias:false,preserveDrawingBuffer:true});
const FS=`precision highp float;
uniform sampler2D uArt;uniform vec4 uRect;uniform vec2 uRes;uniform vec3 uBg;uniform float uOn,uDpr,uMode;
const vec3 PAPER=vec3(.985,.972,.94);const float CELL=6.,MIS=1.5;
vec3 comp(vec2 p){vec2 uv=(p-uRect.xy)/uRect.zw;if(uv.x<0.||uv.y<0.||uv.x>1.||uv.y>1.)return uBg;
  vec4 a=texture2D(uArt,uv);return mix(uBg,a.rgb,a.a);}
mat2 rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}
float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);vec3 o=comp(p),col=o;
  if(uOn>.5&&uMode>2.5){ // Aoh 2026-10-05: the finer plain dot screen ("ลายจุดทับ"), 6 px, 45°, paper grain
    float s=CELL*uDpr;vec2 q=rot(.7854)*p;vec2 cc=(floor(q/s)+.5)*s;
    float d=1.-smoothstep(s*.3-.9,s*.3+.9,length(q-cc));col=o*(1.-.22*d);
    float n=hash(floor(p/uDpr)),f=hash(floor(p/uDpr/vec2(9.,1.5)));col*=1.-.07*n-.03*f;}
  else if(uOn>.5){ // DEC-022 first choice: palette-keeping screen, 6 px, 45°, 1.5 px misregistration, paper grain
    float s=CELL*uDpr;vec2 q=rot(.7854)*(p+vec2(MIS*uDpr));vec2 cc=(floor(q/s)+.5)*s;
    vec3 cs=comp(rot(-.7854)*cc-vec2(MIS*uDpr));float t=1.-dot(cs,vec3(.3,.55,.15));
    float r=s*clamp(.12+.42*sqrt(t),0.,.62);float d=1.-smoothstep(r-.9,r+.9,length(q-cc));
    float cov=3.14159*r*r/(s*s);vec3 dk=col*.72;vec3 lt=min(col+(col-dk)*cov/max(1.-cov,.2),vec3(1.));
    col=mix(lt,dk,d);
    float n=hash(floor(p/uDpr)),f=hash(floor(p/uDpr/vec2(9.,1.5)));col*=1.-.07*n-.03*f;}
  gl_FragColor=vec4(col,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
const pg=gl.createProgram();gl.attachShader(pg,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pg);gl.useProgram(pg);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pg,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pg,n);
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let lastBeat='';
function frame(){
  if(ready){
    const dpr=Math.min(devicePixelRatio||1,2),W=Math.round(innerWidth*dpr),H=Math.round(innerHeight*dpr);
    if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}gl.viewport(0,0,W,H);
    const w=Math.min(W*.98,H*.98*CW/CH),h=w*CH/CW;           // composite fitted to the screen, at screen resolution
    if(comp.width!==Math.round(w)||comp.height!==Math.round(h)){comp.width=Math.round(w);comp.height=Math.round(h);}
    const t=(performance.now()-S.t0)/1000,p=pose(reduce&&S.mode==='play'?4.9:t);
    composite(p,comp.width/CW);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,comp);
    gl.uniform4f(U('uRect'),(W-comp.width)/2,(H-comp.height)/2,comp.width,comp.height);gl.uniform2f(U('uRes'),W,H);
    gl.uniform3f(U('uBg'),246/255,232/255,203/255);gl.uniform1f(U('uOn'),S.screen);gl.uniform1f(U('uMode'),S.dots);gl.uniform1f(U('uDpr'),dpr);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    if(p.beat!==lastBeat){lastBeat=p.beat;$('beat').textContent=LABEL[p.beat];}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const seg=(el,fn)=>el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset.v);});
seg($('size'),v=>S.size=v);seg($('beats'),v=>{S.mode=v;S.t0=performance.now();});
seg($('dots'),v=>{S.screen=v==='0'?0:1;if(v!=='0')S.dots=+v;});
$('min').addEventListener('click',()=>{const m=$('panel').classList.toggle('min');$('min').textContent=m?'ขยาย':'ย่อ';$('min').setAttribute('aria-expanded',!m);});
window.__stage={S,pose};
</script>
</body></html>
